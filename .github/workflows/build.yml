name: Build Ferry

# A push to main or dev only builds, to prove the code still compiles; the files stay on the run page
# (download them with "gh run download"). Pushing a tag like v1.2.0 builds and publishes the release
# that the apps offer as an update.
on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        # Tag builds use the tag. Other builds use the last release tag plus "-dev.<run>",
        # so the apps never offer them as updates.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # The highest release tag in the repo, even when it sits on a main merge commit that dev does not contain.
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            last="${last:-v0.0.0}"
            v="${last#v}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build signed APK
        env:
          FERRY_KEY: ${{ secrets.FERRY_KEY }}
          FERRY_KEY_PASSWORD: ${{ secrets.FERRY_KEY_PASSWORD }}
          FERRY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$FERRY_KEY" | base64 -d > ferry.p12
          export FERRY_KEY_ALIAS=$(keytool -list -keystore ferry.p12 -storetype pkcs12 -storepass "$FERRY_KEY_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          gradle assembleStandardRelease assembleAutoRelease
          cp build/outputs/apk/standard/release/*.apk Ferry.apk
          cp build/outputs/apk/auto/release/*.apk Ferry-Auto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Ferry.apk
            Ferry-Auto.apk

  desktop:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Ferry.exe
        run: dotnet publish desktop/Ferry.csproj -c Release -o out -p:Version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/Ferry.exe

  release:
    needs: [version, android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" Ferry.apk Ferry-Auto.apk Ferry.exe tools/install-ferry-auto.ps1 --title "Ferry $VERSION" --generate-notes --latest
