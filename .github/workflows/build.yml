name: Build Ferry

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build signed APK
        env:
          FERRY_KEY: ${{ secrets.FERRY_KEY }}
          FERRY_KEY_PASSWORD: ${{ secrets.FERRY_KEY_PASSWORD }}
        run: |
          echo "$FERRY_KEY" | base64 -d > ferry.p12
          export FERRY_KEY_ALIAS=$(keytool -list -keystore ferry.p12 -storetype pkcs12 -storepass "$FERRY_KEY_PASSWORD" | grep PrivateKeyEntry | cut -d, -f1)
          gradle assembleRelease
          cp build/outputs/apk/release/*.apk Ferry.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Ferry.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Ferry.exe
        run: dotnet publish desktop/Ferry.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: out/Ferry.exe

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" Ferry.apk Ferry.exe --title "Ferry 1.${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
