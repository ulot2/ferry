plugins {
    id 'com.android.application' version '8.13.0'
}

def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'app.ferry'
    compileSdk 36

    defaultConfig {
        applicationId 'app.ferry'
        minSdk 29
        targetSdk 36
        versionCode build
        versionName System.getenv('FERRY_VERSION') ?: "0.0.0-local"   // set by the GitHub build from the release tag
    }

    // The key comes from GitHub secrets (see .github/workflows/build.yml). A local copy is in keys/.
    signingConfigs {
        release {
            storeFile file('ferry.p12')
            storeType 'pkcs12'
            storePassword System.getenv('FERRY_KEY_PASSWORD')
            keyAlias System.getenv('FERRY_KEY_ALIAS')
            keyPassword System.getenv('FERRY_KEY_PASSWORD')
        }
    }

    buildTypes {
        release { signingConfig signingConfigs.release }
    }

    // Two editions of one app (same id, same key, so either installs over the other):
    // standard installs from any browser; auto adds automatic sending and is installed from a computer.
    flavorDimensions 'edition'
    productFlavors {
        standard { dimension 'edition' }
        auto { dimension 'edition' }
    }
}

dependencies {
    // Google's QR scanner UI (runs inside Play services, no camera permission needed).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // FileProvider, to hand received images to the clipboard.
    implementation 'androidx.core:core:1.15.0'
    // androidx.core pulls Kotlin 1.8 and the QR scanner pulls Kotlin 1.6 helper libraries; align them, or the build sees duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
